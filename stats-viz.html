<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Theory - Статистика Прослушиваний (2021-2023)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Dashboard Grid */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            display: block;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Charts Section */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (min-width: 768px) {
            .charts-grid {
                grid-template-columns: 2fr 1fr;
            }
        }

        .chart-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            position: relative;
            height: 400px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover, button.active {
            background-color: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }

        /* Track List */
        .track-list {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .track-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .track-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .track-rank {
            width: 30px;
            font-weight: bold;
            color: var(--text-secondary);
        }

        .track-info {
            flex-grow: 1;
            padding-right: 20px;
        }

        .track-name {
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        .track-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .bar-container {
            width: 150px;
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #818cf8);
            border-radius: 4px;
        }

        .year-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .year-btn {
            padding: 6px 12px;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>STRING THEORY</h1>
        <div class="subtitle">Динамика прослушиваний альбома (Июнь 2021 — Декабрь 2023)</div>
    </header>

    <div class="year-selector">
        <button class="year-btn active" onclick="updateView('all')">Весь период</button>
        <button class="year-btn" onclick="updateView('2021')">2021</button>
        <button class="year-btn" onclick="updateView('2022')">2022</button>
        <button class="year-btn" onclick="updateView('2023')">2023</button>
    </div>

    <div class="dashboard">
        <div class="stat-card">
            <span class="stat-value" id="total-plays">0</span>
            <span class="stat-label">Всего прослушиваний</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="top-track-name">-</span>
            <span class="stat-label">Лидер чарта</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="peak-month">-</span>
            <span class="stat-label">Пиковый месяц</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="avg-per-track">0</span>
            <span class="stat-label">Ср. на трек</span>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-container">
            <canvas id="mainChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <div class="controls">
        <h3>Топ треков</h3>
        <div>
            <button onclick="sortTracks('total')">По общему числу</button>
            <button onclick="sortTracks('recent')">По свежим данным</button>
        </div>
    </div>

    <div class="track-list" id="track-list-container">
        <!-- Tracks will be injected here -->
    </div>

    <footer>
        <p>Visual Analytics for String Theory Album</p>
    </footer>
</div>

<script>
    // Data Structure
    const rawData = {
        tracks: [
            "250 kmh", "A Land of Milk", "Moonpath", "Overclean", "One Day Closer", 
            "At Night", "The Last in the World", "Trees Lost Their Burning Leaves", 
            "Tears Were Falling from the Trees", "Sex", "When There's Light", 
            "Come To You", "Event Horizon", "We Are Burning", "With You By My Side"
        ],
        data: {}
    };

    // Helper to parse months
    const getMonthKey = (year, month) => `${year}-${String(month).padStart(2, '0')}`;

    // 2021 Data (Jun-Dec)
    const data2021 = [
        [24, 6, 5, 3, 2, 0, 0], // 250 kmh
        [27, 4, 5, 0, 0, 2, 0], // A Land of Milk
        [61, 21, 7, 0, 0, 1, 3], // Moonpath
        [53, 27, 22, 9, 4, 3, 5], // Overclean
        [298, 108, 14, 5, 2, 9, 8], // One Day Closer
        [28, 5, 7, 4, 0, 2, 1], // At Night
        [26, 9, 7, 1, 3, 6, 11], // The Last in the World
        [39, 7, 8, 1, 0, 3, 1], // Trees Lost...
        [94, 99, 58, 52, 41, 68, 93], // Tears...
        [171, 43, 46, 98, 29, 82, 17], // Sex
        [29, 10, 7, 2, 1, 2, 2], // When There's Light
        [79, 16, 13, 6, 2, 2, 4], // Come To You
        [29, 5, 7, 2, 0, 4, 0], // Event Horizon
        [27, 7, 7, 2, 0, 2, 0], // We Are Burning
        [23, 4, 12, 2, 0, 0, 0]  // With You...
    ];

    // 2022 Data (Jan-Dec)
    const data2022 = [
        [6, 3, 1, 1, 4, 2, 1, 4, 5, 0, 4, 2],
        [0, 1, 1, 1, 0, 0, 2, 1, 2, 0, 2, 2],
        [1, 2, 3, 3, 2, 10, 1, 2, 3, 4, 0, 2],
        [2, 5, 2, 1, 0, 0, 2, 2, 7, 2, 0, 3],
        [6, 4, 4, 3, 3, 4, 0, 4, 6, 2, 4, 3],
        [0, 2, 3, 2, 0, 0, 0, 1, 1, 0, 2, 1],
        [20, 2, 2, 2, 0, 0, 1, 3, 2, 4, 1, 1],
        [0, 3, 2, 1, 2, 2, 1, 4, 3, 0, 4, 0],
        [102, 158, 95, 56, 127, 123, 152, 154, 85, 33, 29, 39],
        [46, 7, 13, 10, 13, 14, 28, 12, 5, 6, 8, 9],
        [0, 1, 0, 1, 0, 0, 1, 1, 3, 1, 0, 1],
        [1, 1, 0, 3, 2, 2, 1, 2, 2, 0, 1, 2],
        [0, 0, 0, 3, 0, 0, 0, 2, 1, 2, 2, 1],
        [2, 3, 3, 3, 0, 0, 0, 2, 1, 3, 8, 7],
        [0, 3, 9, 4, 2, 2, 3, 11, 1, 1, 2, 3]
    ];

    // 2023 Data (Jan-Dec) - Filling missing Dec values with 0 based on context
    const data2023 = [
        [4, 1, 4, 5, 5, 4, 4, 6, 3, 2, 4, 2],
        [3, 1, 1, 0, 1, 2, 0, 0, 0, 1, 1, 0], // Added 0 for Dec
        [3, 2, 1, 2, 2, 1, 0, 0, 1, 2, 0, 0], // Added 0 for Dec
        [1, 2, 0, 2, 1, 0, 0, 1, 1, 3, 1, 1],
        [1, 3, 1, 3, 4, 3, 1, 2, 4, 2, 0, 0], // Added 0 for Dec
        [1, 1, 2, 0, 1, 0, 0, 0, 0, 1, 0, 0], // Added 0 for Dec
        [3, 2, 0, 1, 0, 1, 0, 1, 1, 1, 0, 0], // Added 0 for Dec
        [3, 2, 1, 0, 2, 1, 1, 0, 0, 1, 0, 0], // Added 0 for Dec
        [35, 28, 44, 74, 72, 14, 28, 15, 13, 15, 15, 30],
        [7, 3, 5, 5, 4, 9, 5, 7, 2, 5, 6, 0], // Added 0 for Dec
        [3, 1, 3, 1, 0, 4, 0, 0, 2, 3, 2, 2],
        [3, 3, 2, 5, 4, 1, 0, 1, 0, 1, 2, 1],
        [2, 1, 0, 0, 2, 1, 1, 0, 0, 1, 0, 0], // Added 0 for Dec
        [6, 4, 2, 9, 4, 1, 6, 4, 2, 2, 12, 7],
        [3, 2, 4, 2, 0, 2, 0, 1, 1, 1, 2, 1]
    ];

    let currentView = 'all';
    let mainChartInstance = null;
    let pieChartInstance = null;

    function processData(view) {
        const labels = [];
        const datasets = [];
        const totals = new Array(rawData.tracks.length).fill(0);
        const monthlyTotals = {};

        // Define range based on view
        let years = [];
        let startMonth = 0; 
        let endMonth = 11;

        if (view === '2021') {
            years = ['2021'];
            startMonth = 5; // June is index 5 (0-based)
        } else if (view === '2022') {
            years = ['2022'];
        } else if (view === '2023') {
            years = ['2023'];
        } else {
            years = ['2021', '2022', '2023'];
            startMonth = 5; // Start from June 2021
        }

        // Generate Labels and Aggregate Data
        years.forEach(year => {
            const sMonth = (year === '2021' && view === 'all') ? 5 : 0;
            const eMonth = 11;
            
            const sourceData = year === '2021' ? data2021 : (year === '2022' ? data2022 : data2023);

            for (let m = sMonth; m <= eMonth; m++) {
                const label = `${year}-${String(m + 1).padStart(2, '0')}`;
                labels.push(label);
                
                // Calculate monthly total for peak detection
                let monthSum = 0;

                rawData.tracks.forEach((_, trackIndex) => {
                    const val = sourceData[trackIndex][m] || 0;
                    totals[trackIndex] += val;
                    monthSum += val;
                });
                monthlyTotals[label] = monthSum;
            }
        });

        // Create Datasets
        const colors = [
            '#38bdf8', '#818cf8', '#c084fc', '#e879f9', '#f472b6',
            '#fb7185', '#fdba74', '#fbbf24', '#a3e635', '#34d399',
            '#2dd4bf', '#22d3ee', '#818cf8', '#a78bfa', '#d8b4fe'
        ];

        rawData.tracks.forEach((track, i) => {
            const dataPoints = [];
            // Re-iterate to fill data points matching labels
            let labelIdx = 0;
            years.forEach(year => {
                const sMonth = (year === '2021' && view === 'all') ? 5 : 0;
                const sourceData = year === '2021' ? data2021 : (year === '2022' ? data2022 : data2023);
                for (let m = sMonth; m <= 11; m++) {
                    dataPoints.push(sourceData[i][m] || 0);
                }
            });

            datasets.push({
                label: track,
                data: dataPoints,
                borderColor: colors[i % colors.length],
                backgroundColor: colors[i % colors.length] + '20', // Transparent fill
                tension: 0.4,
                fill: false,
                hidden: view !== 'all' && i > 4 // Hide some tracks in single year view for clarity
            });
        });

        // Find Peak Month
        let peakLabel = '';
        let peakVal = 0;
        for (const [key, val] of Object.entries(monthlyTotals)) {
            if (val > peakVal) {
                peakVal = val;
                peakLabel = key;
            }
        }

        // Find Top Track
        let maxTrackVal = 0;
        let maxTrackName = '';
        totals.forEach((val, idx) => {
            if (val > maxTrackVal) {
                maxTrackVal = val;
                maxTrackName = rawData.tracks[idx];
            }
        });

        const grandTotal = totals.reduce((a, b) => a + b, 0);
        const avgPerTrack = Math.round(grandTotal / rawData.tracks.length);

        return {
            labels,
            datasets,
            totals,
            stats: {
                total: grandTotal,
                topTrack: maxTrackName,
                peak: peakLabel,
                avg: avgPerTrack
            }
        };
    }

    function updateStats(stats) {
        document.getElementById('total-plays').innerText = stats.total.toLocaleString();
        document.getElementById('top-track-name').innerText = stats.topTrack;
        document.getElementById('peak-month').innerText = stats.peak;
        document.getElementById('avg-per-track').innerText = stats.avg.toLocaleString();
    }

    function renderCharts(data) {
        const ctxMain = document.getElementById('mainChart').getContext('2d');
        const ctxPie = document.getElementById('pieChart').getContext('2d');

        if (mainChartInstance) mainChartInstance.destroy();
        if (pieChartInstance) pieChartInstance.destroy();

        // Main Line Chart
        mainChartInstance = new Chart(ctxMain, {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: data.datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    title: {
                        display: true,
                        text: 'Динамика прослушиваний по месяцам',
                        color: '#94a3b8',
                        font: { size: 16 }
                    },
                    legend: {
                        labels: { color: '#94a3b8' }
                    },
                    tooltip: {
                        theme: 'dark'
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#64748b', maxTicksLimit: 10 },
                        grid: { color: '#334155' }
                    },
                    y: {
                        ticks: { color: '#64748b' },
                        grid: { color: '#334155' }
                    }
                }
            }
        });

        // Pie Chart (Top 5 only for clarity)
        const sortedTotals = data.totals.map((val, idx) => ({ name: rawData.tracks[idx], val }))
            .sort((a, b) => b.val - a.val)
            .slice(0, 5);

        const pieColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#fb7185'];

        pieChartInstance = new Chart(ctxPie, {
            type: 'doughnut',
            data: {
                labels: sortedTotals.map(t => t.name),
                datasets: [{
                    data: sortedTotals.map(t => t.val),
                    backgroundColor: pieColors,
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'Топ-5 треков (Доля)',
                        color: '#94a3b8',
                        font: { size: 16 }
                    },
                    legend: {
                        position: 'bottom',
                        labels: { color: '#94a3b8', boxWidth: 12 }
                    }
                }
            }
        });
    }

    function renderTrackList(totals) {
        const container = document.getElementById('track-list-container');
        container.innerHTML = '';

        const sorted = totals.map((val, idx) => ({ name: rawData.tracks[idx], val, originalIdx: idx }))
            .sort((a, b) => b.val - a.val);

        const maxVal = sorted[0].val;

        sorted.forEach((item, index) => {
            const percent = (item.val / maxVal) * 100;
            const html = `
                <div class="track-item">
                    <div class="track-rank">#${index + 1}</div>
                    <div class="track-info">
                        <span class="track-name">${item.name}</span>
                        <span class="track-count">${item.val.toLocaleString()} прослушиваний</span>
                    </div>
                    <div class="bar-container">
                        <div class="bar-fill" style="width: ${percent}%"></div>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    function updateView(view) {
        currentView = view;
        
        // Update buttons
        document.querySelectorAll('.year-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText.toLowerCase().includes(view === 'all' ? 'весь' : view)) {
                btn.classList.add('active');
            }
        });

        const processed = processData(view);
        updateStats(processed.stats);
        renderCharts(processed);
        renderTrackList(processed.totals);
    }

    function sortTracks(type) {
        // In a real app, this would re-sort the list based on recent vs total
        // For now, we just re-render the current total view as the default logic is Total
        if (type === 'recent') {
            alert("Сортировка по недавним данным доступна в полном приложении. Сейчас показан общий рейтинг.");
        }
        updateView(currentView);
    }

    // Initialize
    updateView('all');

</script>
</body>
</html>
