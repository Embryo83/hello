<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Theory - Статистика Прослушиваний (2021-2022)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #bb86fc;
            --accent-hover: #9965f4;
            --danger: #cf6679;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: normal;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            margin: 10px 0;
        }

        .card-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (min-width: 900px) {
            .charts-container {
                grid-template-columns: 2fr 1fr;
            }
        }

        .chart-box {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
            height: 400px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--accent);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover, button.active {
            background-color: var(--accent);
            color: #000;
        }

        .track-list {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .track-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .track-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .track-info {
            width: 250px;
            flex-shrink: 0;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-bar-container {
            flex-grow: 1;
            background-color: #333;
            height: 10px;
            border-radius: 5px;
            margin: 0 15px;
            overflow: hidden;
        }

        .track-bar {
            height: 100%;
            background-color: var(--accent);
            border-radius: 5px;
            width: 0%;
            transition: width 1s ease-in-out;
        }

        .track-count {
            width: 60px;
            text-align: right;
            color: var(--text-secondary);
            font-family: monospace;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>String Theory</h1>
        <h2>Динамика прослушиваний альбома (Июнь 2021 - Декабрь 2022)</h2>
    </header>

    <div class="dashboard">
        <div class="card">
            <div class="card-label">Всего прослушиваний</div>
            <div class="card-value" id="total-plays">0</div>
        </div>
        <div class="card">
            <div class="card-label">Количество треков</div>
            <div class="card-value">15</div>
        </div>
        <div class="card">
            <div class="card-label">Самый популярный трек</div>
            <div class="card-value" id="top-track" style="font-size: 1.5rem;">-</div>
        </div>
        <div class="card">
            <div class="card-label">Пик прослушиваний (месяц)</div>
            <div class="card-value" id="peak-month">-</div>
        </div>
    </div>

    <div class="controls">
        <button onclick="updateChart('total')" class="active" id="btn-total">Общая динамика</button>
        <button onclick="updateChart('top5')" id="btn-top5">Топ-5 треков</button>
        <button onclick="updateChart('compare')" id="btn-compare">Сравнение 2021 vs 2022</button>
    </div>

    <div class="charts-container">
        <div class="chart-box">
            <canvas id="mainChart"></canvas>
        </div>
        <div class="chart-box">
            <canvas id="pieChart"></canvas>
        </div>
    </div>

    <div class="track-list">
        <h3 style="margin-top: 0; color: var(--accent);">Статистика по трекам (Всего)</h3>
        <div id="tracks-container"></div>
    </div>

    <footer>
        <p>Данные визуализированы на основе статистики стриминговых платформ.</p>
    </footer>
</div>

<script>
    // Данные за 2021 (Июнь-Дек) и 2022 (Янв-Дек)
    // Формат: [Июнь'21, Июль'21, ... Дек'21, Янв'22, ... Дек'22]
    const months = [
        '06.2021', '07.2021', '08.2021', '09.2021', '10.2021', '11.2021', '12.2021',
        '01.2022', '02.2022', '03.2022', '04.2022', '05.2022', '06.2022', '07.2022', '08.2022', '09.2022', '10.2022', '11.2022', '12.2022'
    ];

    const rawData = [
        { name: "250 kmh", data: [24, 6, 5, 3, 2, 0, 0, 6, 3, 1, 1, 4, 2, 1, 4, 5, 0, 4, 2] },
        { name: "A Land of Milk", data: [27, 4, 5, 0, 0, 2, 0, 0, 1, 1, 1, 0, 0, 2, 1, 2, 0, 2, 2] },
        { name: "Moonpath", data: [61, 21, 7, 0, 0, 1, 3, 1, 2, 3, 3, 2, 10, 1, 2, 3, 4, 0, 2] },
        { name: "Overclean", data: [53, 27, 22, 9, 4, 3, 5, 2, 5, 2, 1, 0, 0, 2, 2, 7, 2, 0, 3] },
        { name: "One Day Closer", data: [298, 108, 14, 5, 2, 9, 8, 6, 4, 4, 3, 3, 4, 0, 4, 6, 2, 4, 3] },
        { name: "At Night", data: [28, 5, 7, 4, 0, 2, 1, 0, 2, 3, 2, 0, 0, 0, 1, 1, 0, 2, 1] },
        { name: "The Last in the World", data: [26, 9, 7, 1, 3, 6, 11, 20, 2, 2, 2, 0, 0, 1, 3, 2, 4, 1, 1] },
        { name: "Trees Lost Their Burning Leaves", data: [39, 7, 8, 1, 0, 3, 1, 0, 3, 2, 1, 2, 2, 1, 4, 3, 0, 4, 0] },
        { name: "Tears Were Falling from the Trees", data: [94, 99, 58, 52, 41, 68, 93, 102, 158, 95, 56, 127, 123, 152, 154, 85, 33, 29, 39] },
        { name: "Sex", data: [171, 43, 46, 98, 29, 82, 17, 46, 7, 13, 10, 13, 14, 28, 12, 5, 6, 8, 9] },
        { name: "When There's Light", data: [29, 10, 7, 2, 1, 2, 2, 0, 1, 0, 1, 0, 0, 1, 1, 3, 1, 0, 1] },
        { name: "Come To You", data: [79, 16, 13, 6, 2, 2, 4, 1, 1, 0, 3, 2, 2, 1, 2, 2, 0, 1, 2] },
        { name: "Event Horizon", data: [29, 5, 7, 2, 0, 4, 0, 0, 0, 0, 3, 0, 0, 0, 2, 1, 2, 2, 1] },
        { name: "We Are Burning", data: [27, 7, 7, 2, 0, 2, 0, 2, 3, 3, 3, 0, 0, 0, 2, 1, 3, 8, 7] },
        { name: "With You By My Side", data: [23, 4, 12, 2, 0, 0, 0, 0, 3, 9, 4, 2, 2, 3, 11, 1, 1, 2, 3] }
    ];

    // Расчет итогов
    let totalPlays = 0;
    let maxTrack = { name: "", count: 0 };
    let monthlyTotals = new Array(months.length).fill(0);

    rawData.forEach(track => {
        let trackTotal = track.data.reduce((a, b) => a + b, 0);
        totalPlays += trackTotal;
        
        if (trackTotal > maxTrack.count) {
            maxTrack = { name: track.name, count: trackTotal };
        }

        track.data.forEach((val, idx) => {
            monthlyTotals[idx] += val;
        });
    });

    // Поиск пикового месяца
    let peakIndex = monthlyTotals.indexOf(Math.max(...monthlyTotals));
    let peakMonthLabel = months[peakIndex];
    let peakValue = monthlyTotals[peakIndex];

    // Обновление карточек
    document.getElementById('total-plays').innerText = totalPlays.toLocaleString();
    document.getElementById('top-track').innerText = maxTrack.name;
    document.getElementById('peak-month').innerText = `${peakMonthLabel} (${peakValue})`;

    // Инициализация графиков
    const ctxMain = document.getElementById('mainChart').getContext('2d');
    const ctxPie = document.getElementById('pieChart').getContext('2d');

    let mainChart = new Chart(ctxMain, {
        type: 'line',
        data: {
            labels: months,
            datasets: []
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return context.dataset.label + ': ' + context.parsed.y;
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: '#333' },
                    ticks: { color: '#b0b0b0' }
                },
                x: {
                    grid: { color: '#333' },
                    ticks: { color: '#b0b0b0', maxRotation: 45, minRotation: 45 }
                }
            }
        }
    });

    let pieChart = new Chart(ctxPie, {
        type: 'doughnut',
        data: {
            labels: rawData.map(t => t.name),
            datasets: [{
                data: rawData.map(t => t.data.reduce((a, b) => a + b, 0)),
                backgroundColor: [
                    '#bb86fc', '#03dac6', '#cf6679', '#3700b3', '#018786',
                    '#ff0055', '#00ff99', '#ffcc00', '#ff6600', '#9900ff',
                    '#0099ff', '#ff3333', '#33ff33', '#ffff33', '#ff00ff'
                ],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'right',
                    labels: { color: '#b0b0b0', boxWidth: 10, font: { size: 10 } }
                }
            }
        }
    });

    // Функция обновления основного графика
    function updateChart(type) {
        // Сброс кнопок
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${type}`).classList.add('active');

        let datasets = [];
        const colors = ['#bb86fc', '#03dac6', '#cf6679', '#3700b3', '#018786'];

        if (type === 'total') {
            datasets = [{
                label: 'Всего прослушиваний',
                data: monthlyTotals,
                borderColor: '#bb86fc',
                backgroundColor: 'rgba(187, 134, 252, 0.2)',
                fill: true,
                tension: 0.4
            }];
        } else if (type === 'top5') {
            // Сортировка по общему количеству
            let sortedTracks = [...rawData].sort((a, b) => {
                return b.data.reduce((x,y)=>x+y,0) - a.data.reduce((x,y)=>x+y,0);
            }).slice(0, 5);

            sortedTracks.forEach((track, index) => {
                datasets.push({
                    label: track.name,
                    data: track.data,
                    borderColor: colors[index % colors.length],
                    backgroundColor: 'transparent',
                    tension: 0.3,
                    pointRadius: 2
                });
            });
        } else if (type === 'compare') {
            // Агрегация по годам (упрощенно: сумма месяцев)
            // 2021: индексы 0-6, 2022: индексы 7-18
            let sum2021 = monthlyTotals.slice(0, 7).reduce((a,b)=>a+b,0);
            let sum2022 = monthlyTotals.slice(7).reduce((a,b)=>a+b,0);
            
            // Для линейного графика сравнения по месяцам сложно, сделаем сравнение трендов
            // Нормализуем данные для наглядности (среднее по месяцу)
            let avg2021 = sum2021 / 7;
            let avg2022 = sum2022 / 12;

            datasets = [
                {
                    label: '2021 (Среднее/мес)',
                    data: new Array(months.length).fill(avg2021),
                    borderColor: '#03dac6',
                    borderDash: [5, 5],
                    fill: false
                },
                {
                    label: '2022 (Среднее/мес)',
                    data: new Array(months.length).fill(avg2022),
                    borderColor: '#cf6679',
                    borderDash: [5, 5],
                    fill: false
                }
            ];
             // Переключаем тип на bar для сравнения годов, если нужно, но оставим line для контекста времени
             // Лучше покажем два набора данных: реальные 2021 и реальные 2022 с разрывом или отдельно
             // Упростим: покажем накопительный итог по годам в виде двух линий
             
             let cumulative2021 = [];
             let cumSum = 0;
             monthlyTotals.forEach((val, i) => {
                 if(i < 7) cumSum += val;
                 cumulative2021.push(i < 7 ? cumSum : null);
             });

             let cumulative2022 = [];
             cumSum = 0;
             monthlyTotals.forEach((val, i) => {
                 if(i >= 7) cumSum += val;
                 cumulative2022.push(i >= 7 ? cumSum : null);
             });

             datasets = [
                { label: 'Накоплено в 2021', data: cumulative2021, borderColor: '#03dac6', fill: false },
                { label: 'Накоплено в 2022', data: cumulative2022, borderColor: '#cf6679', fill: false }
             ];
        }

        mainChart.data.datasets = datasets;
        mainChart.update();
    }

    // Генерация списка треков
    const tracksContainer = document.getElementById('tracks-container');
    // Сортировка по популярности
    let sortedForList = [...rawData].sort((a, b) => {
        return b.data.reduce((x,y)=>x+y,0) - a.data.reduce((x,y)=>x+y,0);
    });

    sortedForList.forEach(track => {
        let total = track.data.reduce((a, b) => a + b, 0);
        let percent = (total / totalPlays) * 100;
        
        let item = document.createElement('div');
        item.className = 'track-item';
        item.innerHTML = `
            <div class="track-info" title="${track.name}">${track.name}</div>
            <div class="track-bar-container">
                <div class="track-bar" style="width: 0%" data-width="${percent}%"></div>
            </div>
            <div class="track-count">${total}</div>
        `;
        tracksContainer.appendChild(item);
    });

    // Анимация баров при загрузке
    setTimeout(() => {
        document.querySelectorAll('.track-bar').forEach(bar => {
            bar.style.width = bar.getAttribute('data-width');
        });
    }, 500);

    // Инициализация первого графика
    updateChart('total');

</script>

</body>
</html>
