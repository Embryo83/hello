<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Theory - Статистика прослушиваний (2021-2023)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Dashboard Grid */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            display: block;
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Charts Section */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (min-width: 768px) {
            .charts-grid {
                grid-template-columns: 2fr 1fr;
            }
        }

        .chart-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            position: relative;
            height: 400px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover, button.active {
            background-color: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }

        /* Table Section */
        .table-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        th:first-child, td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background-color: var(--card-bg);
            z-index: 10;
        }
        
        th {
            background-color: #253347;
            color: var(--accent);
            font-weight: 600;
        }

        tr:hover {
            background-color: #253347;
        }

        .total-row {
            font-weight: bold;
            color: var(--accent);
            border-top: 2px solid var(--border);
        }

        .bar-cell {
            height: 4px;
            background-color: var(--border);
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .bar-fill {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.5s ease;
        }

        .track-name-cell {
            display: flex;
            flex-direction: column;
        }
        
        .track-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>String Theory</h1>
        <div class="subtitle">Динамика прослушиваний альбома (Июнь 2021 — Декабрь 2023)</div>
    </header>

    <div class="dashboard" id="statsDashboard">
        <!-- Cards will be injected here -->
    </div>

    <div class="controls">
        <button onclick="setView('timeline')" class="active" id="btn-timeline">Динамика по времени</button>
        <button onclick="setView('distribution')" id="btn-distribution">Распределение по трекам</button>
        <button onclick="setView('heatmap')" id="btn-heatmap">Годовая активность</button>
    </div>

    <div class="charts-grid">
        <div class="chart-container">
            <canvas id="mainChart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="sideChart"></canvas>
        </div>
    </div>

    <h2 style="margin-top: 40px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Детальная статистика</h2>
    <div class="table-container">
        <table id="statsTable">
            <thead>
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- RAW DATA ---
    // Format: [Jun, Jul, Aug, Sep, Oct, Nov, Dec] for 2021
    // Full year arrays for 2022 and 2023
    
    const tracks = [
        "250 kmh",
        "A Land of Milk",
        "Moonpath",
        "Overclean",
        "One Day Closer",
        "At Night",
        "The Last in the World",
        "Trees Lost Their Burning Leaves",
        "Tears Were Falling from the Trees",
        "Sex",
        "When There's Light",
        "Come To You",
        "Event Horizon",
        "We Are Burning",
        "With You By My Side"
    ];

    // Data structure: { trackName: [values...] }
    // 2021 starts from June (index 0 = June). We will pad with 0s for Jan-May later if needed for alignment, 
    // but for simplicity in charts, we'll map months explicitly.
    
    const rawData = {
        "250 kmh": {
            2021: [24, 6, 5, 3, 2, 0, 0], // Jun-Dec
            2022: [6, 3, 1, 1, 4, 2, 1, 4, 5, 0, 4, 2],
            2023: [4, 1, 4, 5, 5, 4, 4, 6, 3, 2, 4, 2]
        },
        "A Land of Milk": {
            2021: [27, 4, 5, 0, 0, 2, 0],
            2022: [0, 1, 1, 1, 0, 0, 2, 1, 2, 0, 2, 2],
            2023: [3, 1, 1, 0, 1, 2, 0, 0, 0, 1, 1, 0] // Filled missing Dec with 0
        },
        "Moonpath": {
            2021: [61, 21, 7, 0, 0, 1, 3],
            2022: [1, 2, 3, 3, 2, 10, 1, 2, 3, 4, 0, 2],
            2023: [3, 2, 1, 2, 2, 1, 0, 0, 1, 2, 0, 0] // Filled missing Nov, Dec with 0
        },
        "Overclean": {
            2021: [53, 27, 22, 9, 4, 3, 5],
            2022: [2, 5, 2, 1, 0, 0, 2, 2, 7, 2, 0, 3],
            2023: [1, 2, 0, 2, 1, 0, 0, 1, 1, 3, 1, 1]
        },
        "One Day Closer": {
            2021: [298, 108, 14, 5, 2, 9, 8],
            2022: [6, 4, 4, 3, 3, 4, 0, 4, 6, 2, 4, 3],
            2023: [1, 3, 1, 3, 4, 3, 1, 2, 4, 2, 0, 0] // Filled missing Dec with 0
        },
        "At Night": {
            2021: [28, 5, 7, 4, 0, 2, 1],
            2022: [0, 2, 3, 2, 0, 0, 0, 1, 1, 0, 2, 1],
            2023: [1, 1, 2, 0, 1, 0, 0, 0, 0, 1, 0, 0] // Filled missing Dec with 0
        },
        "The Last in the World": {
            2021: [26, 9, 7, 1, 3, 6, 11],
            2022: [20, 2, 2, 2, 0, 0, 1, 3, 2, 4, 1, 1],
            2023: [3, 2, 0, 1, 0, 1, 0, 1, 1, 1, 0, 0] // Filled missing Dec with 0
        },
        "Trees Lost Their Burning Leaves": {
            2021: [39, 7, 8, 1, 0, 3, 1],
            2022: [0, 3, 2, 1, 2, 2, 1, 4, 3, 0, 4, 0],
            2023: [3, 2, 1, 0, 2, 1, 1, 0, 0, 1, 0, 0] // Filled missing Dec with 0
        },
        "Tears Were Falling from the Trees": {
            2021: [94, 99, 58, 52, 41, 68, 93],
            2022: [102, 158, 95, 56, 127, 123, 152, 154, 85, 33, 29, 39],
            2023: [35, 28, 44, 74, 72, 14, 28, 15, 13, 15, 15, 30]
        },
        "Sex": {
            2021: [171, 43, 46, 98, 29, 82, 17],
            2022: [46, 7, 13, 10, 13, 14, 28, 12, 5, 6, 8, 9],
            2023: [7, 3, 5, 5, 4, 9, 5, 7, 2, 5, 6, 0] // Filled missing Dec with 0
        },
        "When There's Light": {
            2021: [29, 10, 7, 2, 1, 2, 2],
            2022: [0, 1, 0, 1, 0, 0, 1, 1, 3, 1, 0, 1],
            2023: [3, 1, 3, 1, 0, 4, 0, 0, 2, 3, 2, 2]
        },
        "Come To You": {
            2021: [79, 16, 13, 6, 2, 2, 4],
            2022: [1, 1, 0, 3, 2, 2, 1, 2, 2, 0, 1, 2],
            2023: [3, 3, 2, 5, 4, 1, 0, 1, 0, 1, 2, 1]
        },
        "Event Horizon": {
            2021: [29, 5, 7, 2, 0, 4, 0],
            2022: [0, 0, 0, 3, 0, 0, 0, 2, 1, 2, 2, 1],
            2023: [2, 1, 0, 0, 2, 1, 1, 0, 0, 1, 0, 0] // Filled missing Dec with 0
        },
        "We Are Burning": {
            2021: [27, 7, 7, 2, 0, 2, 0],
            2022: [2, 3, 3, 3, 0, 0, 0, 2, 1, 3, 8, 7],
            2023: [6, 4, 2, 9, 4, 1, 6, 4, 2, 2, 12, 7]
        },
        "With You By My Side": {
            2021: [23, 4, 12, 2, 0, 0, 0],
            2022: [0, 3, 9, 4, 2, 2, 3, 11, 1, 1, 2, 3],
            2023: [3, 2, 4, 2, 0, 2, 0, 1, 1, 1, 2, 1]
        }
    };

    // Helper to generate full timeline labels and data
    function processData() {
        const monthsFull = ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];
        let labels = [];
        let years = [2021, 2022, 2023];
        
        // Generate labels
        // 2021 starts from June (index 5)
        for(let m=5; m<12; m++) labels.push(`Июн-${m===5?'21':m===6?'21':m===7?'21':m===8?'21':m===9?'21':m===10?'21':'21'}`); 
        // Let's do it properly with Year-Month
        labels = [];
        for (let m = 5; m < 12; m++) labels.push(`${monthsFull[m]} '21`);
        for (let m = 0; m < 12; m++) labels.push(`${monthsFull[m]} '22`);
        for (let m = 0; m < 12; m++) labels.push(`${monthsFull[m]} '23`);

        let datasets = [];
        let totals = new Array(labels.length).fill(0);
        let trackTotals = {};

        tracks.forEach((track, index) => {
            let dataPoints = [];
            let sum = 0;

            // 2021 part (7 months)
            rawData[track][2021].forEach(val => {
                dataPoints.push(val);
                sum += val;
            });
            // 2022 part
            rawData[track][2022].forEach(val => {
                dataPoints.push(val);
                sum += val;
            });
            // 2023 part
            rawData[track][2023].forEach(val => {
                dataPoints.push(val);
                sum += val;
            });

            trackTotals[track] = sum;

            // Add to global totals
            dataPoints.forEach((val, i) => {
                totals[i] += val;
            });

            // Color generation based on index
            const hue = (index * 25) % 360;
            const color = `hsla(${hue}, 70%, 60%, 0.8)`;
            const bgColor = `hsla(${hue}, 70%, 60%, 0.2)`;

            datasets.push({
                label: track,
                data: dataPoints,
                borderColor: color,
                backgroundColor: bgColor,
                borderWidth: 2,
                pointRadius: 1,
                fill: false,
                hidden: index > 4 // Hide some by default to avoid clutter
            });
        });

        return { labels, datasets, totals, trackTotals };
    }

    const processed = processData();
    let mainChartInst = null;
    let sideChartInst = null;

    function initDashboard() {
        // Calculate KPIs
        const totalPlays = Object.values(processed.trackTotals).reduce((a,b)=>a+b, 0);
        const topTrack = Object.entries(processed.trackTotals).sort((a,b)=>b[1]-a[1])[0];
        const maxMonthVal = Math.max(...processed.totals);
        const maxMonthIndex = processed.totals.indexOf(maxMonthVal);
        const peakMonth = processed.labels[maxMonthIndex];

        // Render Cards
        const dashboard = document.getElementById('statsDashboard');
        dashboard.innerHTML = `
            <div class="stat-card">
                <span class="stat-value">${totalPlays.toLocaleString()}</span>
                <span class="stat-label">Всего прослушиваний</span>
            </div>
            <div class="stat-card">
                <span class="stat-value">${tracks.length}</span>
                <span class="stat-label">Треков в альбоме</span>
            </div>
            <div class="stat-card">
                <span class="stat-value">${topTrack[0]}</span>
                <span class="stat-label">Лидер (${topTrack[1].toLocaleString()})</span>
            </div>
            <div class="stat-card">
                <span class="stat-value">${peakMonth}</span>
                <span class="stat-label">Пик активности (${maxMonthVal})</span>
            </div>
        `;

        renderTable();
        setView('timeline');
    }

    function setView(view) {
        // Update buttons
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${view}`).classList.add('active');

        const ctxMain = document.getElementById('mainChart').getContext('2d');
        const ctxSide = document.getElementById('sideChart').getContext('2d');

        if (mainChartInst) mainChartInst.destroy();
        if (sideChartInst) sideChartInst.destroy();

        if (view === 'timeline') {
            // Main: Line chart of all tracks (or stacked area)
            mainChartInst = new Chart(ctxMain, {
                type: 'line',
                data: {
                    labels: processed.labels,
                    datasets: processed.datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        title: { display: true, text: 'Динамика прослушиваний по месяцам', color: '#94a3b8' },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: { ticks: { color: '#94a3b8', maxTicksLimit: 12 }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                    }
                }
            });

            // Side: Total per month bar chart
            sideChartInst = new Chart(ctxSide, {
                type: 'bar',
                data: {
                    labels: processed.labels,
                    datasets: [{
                        label: 'Всего в месяц',
                        data: processed.totals,
                        backgroundColor: '#38bdf8',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: 'Общая активность', color: '#94a3b8' },
                        legend: { display: false }
                    },
                    scales: {
                        x: { display: false },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                    }
                }
            });

        } else if (view === 'distribution') {
            // Main: Bar chart of total per track
            const sortedTracks = Object.entries(processed.trackTotals).sort((a,b) => b[1] - a[1]);
            
            mainChartInst = new Chart(ctxMain, {
                type: 'bar',
                data: {
                    labels: sortedTracks.map(i => i[0]),
                    datasets: [{
                        label: 'Всего прослушиваний',
                        data: sortedTracks.map(i => i[1]),
                        backgroundColor: sortedTracks.map((_, i) => `hsla(${i * 25}, 70%, 60%, 0.8)`),
                        borderRadius: 6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: 'Распределение по трекам (Total)', color: '#94a3b8' },
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#f8fafc' }, grid: { display: false } }
                    }
                }
            });

            // Side: Pie chart of top 5
            const top5 = sortedTracks.slice(0, 5);
            const others = sortedTracks.slice(5).reduce((sum, item) => sum + item[1], 0);
            
            sideChartInst = new Chart(ctxSide, {
                type: 'doughnut',
                data: {
                    labels: [...top5.map(i => i[0]), 'Остальные'],
                    datasets: [{
                        data: [...top5.map(i => i[1]), others],
                        backgroundColor: [
                            '#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#fb923c', '#475569'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: 'Топ-5 треков', color: '#94a3b8' },
                        legend: { position: 'bottom', labels: { color: '#94a3b8', font: {size: 10} } }
                    }
                }
            });

        } else if (view === 'heatmap') {
            // Simplified Heatmap using Bar groups or Scatter? 
            // Let's do Grouped Bar by Year for each track? Too crowded.
            // Let's do Line chart comparing Years for the TOP track only?
            // Or Average per month across years?
            
            // Let's show Total per Year
            const yearsData = [0,0,0]; // 21, 22, 23
            
            // Calc 2021 (only 7 months)
            processed.datasets.forEach(ds => {
                ds.data.slice(0, 7).forEach(v => yearsData[0] += v);
                ds.data.slice(7, 19).forEach(v => yearsData[1] += v);
                ds.data.slice(19, 31).forEach(v => yearsData[2] += v);
            });

            mainChartInst = new Chart(ctxMain, {
                type: 'bar',
                data: {
                    labels: ['2021 (7 мес)', '2022', '2023'],
                    datasets: [{
                        label: 'Прослушиваний за год',
                        data: yearsData,
                        backgroundColor: ['#38bdf8', '#818cf8', '#c084fc'],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: 'Активность по годам', color: '#94a3b8' },
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                        x: { ticks: { color: '#f8fafc' }, grid: { display: false } }
                    }
                }
            });

            // Side: Growth rate text or simple stat
            ctxSide.canvas.parentNode.innerHTML = `
                <div style="display:flex; flex-direction:column; justify-content:center; height:100%; text-align:center; color:#94a3b8;">
                    <h3 style="color:#f8fafc">Тренд</h3>
                    <p>2021 (частичный): ${yearsData[0]}</p>
                    <p>2022 (полный): ${yearsData[1]}</p>
                    <p>2023 (полный): ${yearsData[2]}</p>
                    <hr style="border-color:#334155; width:50%; margin: 20px auto;">
                    <p style="font-size:0.9rem">Данные показывают устойчивость интереса к альбому во второй полный год.</p>
                </div>
            `;
        }
    }

    function renderTable() {
        const thead = document.getElementById('tableHeader');
        const tbody = document.getElementById('tableBody');
        
        // Header
        let headerHTML = '<th>Трек</th>';
        processed.labels.forEach(l => {
            headerHTML += `<th>${l.split(' ')[0]}</th>`; // Just month name
        });
        headerHTML += '<th>TOTAL</th>';
        thead.innerHTML = headerHTML;

        // Body
        let bodyHTML = '';
        
        // Sort tracks by total desc
        const sortedEntries = Object.entries(processed.trackTotals).sort((a,b) => b[1] - a[1]);
        const maxTotal = sortedEntries[0][1];

        sortedEntries.forEach(([track, total]) => {
            const data = rawData[track];
            let row = `<tr>
                <td class="track-name-cell">
                    <strong>${track}</strong>
                </td>`;
            
            // 2021
            data[2021].forEach(v => row += `<td>${v}</td>`);
            // 2022
            data[2022].forEach(v => row += `<td>${v}</td>`);
            // 2023
            data[2023].forEach(v => row += `<td>${v}</td>`);

            // Total with bar
            const pct = (total / maxTotal) * 100;
            row += `<td>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span>${total}</span>
                    <div class="bar-cell" style="width:60px;"><div class="bar-fill" style="width:${pct}%"></div></div>
                </div>
            </td>`;
            
            row += '</tr>';
            bodyHTML += row;
        });

        // Grand Total Row
        let grandTotal = processed.totals.reduce((a,b)=>a+b,0);
        let footerRow = `<tr class="total-row"><td>ВСЕГО</td>`;
        processed.totals.forEach(t => footerRow += `<td>${t}</td>`);
        footerRow += `<td>${grandTotal.toLocaleString()}</td></tr>`;
        
        tbody.innerHTML = bodyHTML + footerRow;
    }

    // Start
    initDashboard();

</script>
</body>
</html>
