<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Theory - Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #bb86fc;
            --accent-hover: #9965f4;
            --border: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        button:hover, button.active {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            display: block;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .chart-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 40px;
            position: relative;
            height: 400px;
            width: 100%;
        }

        .table-container {
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--border);
        }

        th:first-child, td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background-color: var(--card-bg);
            z-index: 1;
        }
        
        /* Fix for sticky header background */
        thead th {
            background-color: #2c2c2c;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        
        thead th:first-child {
            z-index: 3;
        }

        th {
            color: var(--accent);
            font-weight: 600;
            white-space: nowrap;
        }

        tr:hover {
            background-color: #2a2a2a;
        }

        .track-bar {
            height: 4px;
            background-color: #333;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .track-fill {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 1s ease-in-out;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .chart-container { height: 300px; }
            th, td { padding: 8px 4px; font-size: 0.8rem; }
        }
    </style>
</head>

<div class="container">
    <header>
        <h1>String Theory</h1>
        <h2>Listening Statistics (2021 - 2024)</h2>
    </header>

    <div class="controls">
        <button onclick="updateChart('line')" id="btn-line" class="active">Timeline</button>
        <button onclick="updateChart('bar')" id="btn-bar">By Track</button>
        <button onclick="updateChart('doughnut')" id="btn-doughnut">Distribution</button>
        <button onclick="resetData()">Reset View</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">

        </div>
        <div class="stat-card">

        </div>

    </div>

    <div class="chart-container">

        </table>
    </div>
</div>

        { track: "With You By My Side", data: { "01.2024": 3, "02.2024": 0, "03.2024": 0, "04.2024": 0, "05.2024": 0, "06.2024": 4, "07.2024": 0, "08.2024": 0, "09.2024": 5, "10.2024": 1, "11.2024": 0, "12.2024": 1 } }
    ];

    let chartInstance = null;
    let currentView = 'line';

    function processData() {
        const tracks = {};
        const monthsSet = new Set();

        rawData.forEach(item => {
            if (!tracks[item.track]) tracks[item.track] = {};
            for (const [month, count] of Object.entries(item.data)) {
                tracks[item.track][month] = count;
                monthsSet.add(month);
            }
        });

        const sortedMonths = Array.from(monthsSet).sort((a, b) => {
            const [m1, y1] = a.split('.');
            const [m2, y2] = b.split('.');
            return new Date(y1, m1-1) - new Date(y2, m2-1);
        });

        const trackNames = Object.keys(tracks);
        
        // Calculate totals per track
        const trackTotals = trackNames.map(name => {
            let sum = 0;
            sortedMonths.forEach(m => sum += (tracks[name][m] || 0));
            return { name, total: sum };
        }).sort((a, b) => b.total - a.total);

        // Calculate monthly totals
        const monthlyTotals = sortedMonths.map(m => {
            let sum = 0;
            trackNames.forEach(t => sum += (tracks[t][m] || 0));
            return { month: m, total: sum };
        });

        return { tracks, sortedMonths, trackNames, trackTotals, monthlyTotals };
    }

    function updateStats(data) {
        const totalListens = data.monthlyTotals.reduce((acc, curr) => acc + curr.total, 0);
        document.getElementById('total-listens').textContent = totalListens.toLocaleString();

        const topTrack = data.trackTotals[0];
        document.getElementById('top-track').textContent = topTrack.name;

        const peak = data.monthlyTotals.reduce((prev, current) => (prev.total > current.total) ? prev : current);
        document.getElementById('peak-month').textContent = peak.month;

        const avg = Math.round(totalListens / data.sortedMonths.length);
        document.getElementById('avg-monthly').textContent = avg.toLocaleString();
    }

    function renderTable(data) {
        const thead = document.getElementById('tableHeader');
        const tbody = document.getElementById('tableBody');
        
        thead.innerHTML = '<th>Track</th>' + data.sortedMonths.map(m => `<th>${m}</th>`).join('') + '<th>Total</th>';
        
        tbody.innerHTML = '';
        const maxTotal = data.trackTotals[0].total;

        data.trackTotals.forEach(track => {
            const tr = document.createElement('tr');
            let cells = `<td>
                <div>${track.name}</div>
                <div class="track-bar"><div class="track-fill" style="width: ${(track.total / maxTotal) * 100}%"></div></div>
            </td>`;
            
            data.sortedMonths.forEach(m => {
                const val = data.tracks[track.name][m] || 0;
                cells += `<td>${val === 0 ? '' : val}</td>`;
            });
            
            cells += `<td><strong>${track.total}</strong></td>`;
            tr.innerHTML = cells;
            tbody.appendChild(tr);
        });
    }

    function updateChart(type) {
        currentView = type;
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${type}`).classList.add('active');

        const ctx = document.getElementById('mainChart').getContext('2d');
        const data = processData();

        if (chartInstance) chartInstance.destroy();

        const colors = [
            '#bb86fc', '#03dac6', '#cf6679', '#ffb74d', '#4db6ac', 
            '#ba68c8', '#ef5350', '#ffa726', '#66bb6a', '#42a5f5',
            '#ab47bc', '#ec407a', '#ffca28', '#26a69a', '#5c6bc0'
        ];

        let config = {};

        if (type === 'line') {
            const datasets = data.trackNames.map((name, index) => ({
                label: name,
                data: data.sortedMonths.map(m => data.tracks[name][m] || 0),
                borderColor: colors[index % colors.length],
                backgroundColor: colors[index % colors.length],
                tension: 0.3,
                pointRadius: 2,
                fill: false
            }));

            config = {
                type: 'line',
                data: { labels: data.sortedMonths, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#b0b0b0', boxWidth: 10 } },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: { ticks: { color: '#b0b0b0' }, grid: { color: '#333' } },
                        y: { ticks: { color: '#b0b0b0' }, grid: { color: '#333' } }
                    }
                }
            };
        } else if (type === 'bar') {
            const datasets = [{
                label: 'Total Listens',
                data: data.trackTotals.map(t => t.total),
                backgroundColor: colors,
                borderColor: '#1e1e1e',
                borderWidth: 1
            }];

            config = {
                type: 'bar',
                data: { labels: data.trackTotals.map(t => t.name), datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: (ctx) => `${ctx.raw} listens` } }
                    },
                    scales: {
                        x: { ticks: { color: '#b0b0b0' }, grid: { color: '#333' } },
                        y: { ticks: { color: '#b0b0b0' }, grid: { display: false } }
                    }
                }
            };
        } else if (type === 'doughnut') {
            const datasets = [{
                data: data.trackTotals.map(t => t.total),
                backgroundColor: colors,
                borderColor: '#1e1e1e',
                borderWidth: 2
            }];

            config = {
                type: 'doughnut',
                data: { labels: data.trackTotals.map(t => t.name), datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: '#b0b0b0', boxWidth: 10 } }
                    }
                }
            };
        }

        chartInstance = new Chart(ctx, config);
    }

    function resetData() {
        updateChart('line');
    }

    // Initialize
    window.onload = () => {
        const data = processData();
        updateStats(data);
        renderTable(data);
        updateChart('line');
    };
</script>

</body>
</html>
